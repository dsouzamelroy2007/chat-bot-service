server.port=8080
server.servlet.contextPath=/bot

spring.main.allow-bean-definition-overriding=true
management.metrics.web.server.auto-time-requests=false

logging.level.root=INFO

resilience4j.timelimiter.instances.chatReply.timeout-duration=20s
resilience4j.circuitbreaker.instances.chatReply.sliding-window-size=10
resilience4j.circuitbreaker.instances.chatReply.failure-rate-threshold=50

spring.ai.anthropic.api-key=${ANTHROPIC_API_KEY}
spring.ai.anthropic.chat.options.model=${CHATBOT_MODEL:claude-sonnet-5}
chatbot.system-prompt=You are a helpful, friendly customer support chat bot. Keep replies concise.

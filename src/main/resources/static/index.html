<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat Bot</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f4f5f7;
    --panel: #ffffff;
    --border: #e2e4e9;
    --text: #1c1e21;
    --muted: #6b7280;
    --accent: #2563eb;
    --accent-text: #ffffff;
    --bot-bubble: #eef1f6;
    --error: #dc2626;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17181b;
      --panel: #212226;
      --border: #33353a;
      --text: #e7e8ea;
      --muted: #9aa0a8;
      --bot-bubble: #2c2e33;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  .chat {
    width: 100%;
    max-width: 480px;
    height: 640px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
  }
  .chat-header {
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
  }
  .chat-header h1 {
    margin: 0;
    font-size: 16px;
    font-weight: 600;
  }
  .chat-header p {
    margin: 2px 0 0;
    font-size: 12px;
    color: var(--muted);
  }
  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .bubble {
    max-width: 78%;
    padding: 10px 14px;
    border-radius: 14px;
    font-size: 14px;
    line-height: 1.4;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .bubble.user {
    align-self: flex-end;
    background: var(--accent);
    color: var(--accent-text);
    border-bottom-right-radius: 4px;
  }
  .bubble.bot {
    align-self: flex-start;
    background: var(--bot-bubble);
    border-bottom-left-radius: 4px;
  }
  .bubble.error {
    align-self: flex-start;
    background: transparent;
    border: 1px solid var(--error);
    color: var(--error);
  }
  .bubble .meta {
    display: block;
    margin-top: 4px;
    font-size: 10px;
    opacity: 0.65;
  }
  .typing {
    align-self: flex-start;
    font-size: 13px;
    color: var(--muted);
    padding: 0 4px;
  }
  form {
    display: flex;
    gap: 8px;
    padding: 12px;
    border-top: 1px solid var(--border);
  }
  input[type="text"] {
    flex: 1;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
  }
  input[type="text"]:focus {
    outline: 2px solid var(--accent);
    outline-offset: -1px;
  }
  button {
    padding: 10px 16px;
    border: none;
    border-radius: 8px;
    background: var(--accent);
    color: var(--accent-text);
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  button:disabled {
    opacity: 0.6;
    cursor: not-allowed;
  }
</style>
</head>
<body>
  <div class="chat">
    <div class="chat-header">
      <h1>Chat Bot</h1>
      <p>Demo widget for the chat-bot-service API</p>
    </div>
    <div class="messages" id="messages"></div>
    <form id="chat-form">
      <input type="text" id="message-input" placeholder="Ask something…" autocomplete="off" required>
      <button type="submit" id="send-button">Send</button>
    </form>
  </div>

  <script>
    // Points at the live Render backend by default -- an absolute URL works identically whether
    // this file is served same-origin by the Spring Boot app itself (its own /bot context path)
    // or standalone (e.g. on Vercel), so one committed value covers both without a per-deploy
    // edit. Override with window.CHAT_API_BASE_URL = "..."; before this block if pointing at a
    // different backend. See docs/DEPLOY_WIDGET.md.
    const API_BASE_URL = window.CHAT_API_BASE_URL || "https://chat-bot-service-06gv.onrender.com/bot";
    // Matches chatbot.security.api-key (CHATBOT_API_KEY) set on the live Render backend --
    // hardcoded here for the same reason API_BASE_URL is: this static widget has
    // no build step on Vercel, so there's no way to inject it at deploy time. This is a shared
    // secret with the backend, not a per-visitor one: anyone viewing this page's source can read
    // it. It stops anonymous scripts/bots that don't bother and off-origin callers (still blocked
    // by the backend's own CORS allow-list), not a determined visitor of the widget itself.
    // Override with window.CHAT_API_KEY = "..."; before this block if pointing at a different
    // backend with its own key.
    const API_KEY = window.CHAT_API_KEY || "b5da2b13af15341cdee647910fbc12ed460c2f3bf7174c7f";
    const BOT_ID = "web-widget";
    const USER_ID = getOrCreateId("chatbot_user_id");
    let conversationId = localStorage.getItem("chatbot_conversation_id") || null;

    const messagesEl = document.getElementById("messages");
    const formEl = document.getElementById("chat-form");
    const inputEl = document.getElementById("message-input");
    const sendButton = document.getElementById("send-button");

    function getOrCreateId(storageKey) {
      let id = localStorage.getItem(storageKey);
      if (!id) {
        id = (crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random().toString(16).slice(2)}`);
        localStorage.setItem(storageKey, id);
      }
      return id;
    }

    function formatTime(date) {
      return date.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
    }

    function addBubble(text, kind) {
      const bubble = document.createElement("div");
      bubble.className = "bubble " + kind;
      const content = document.createElement("span");
      content.className = "content";
      content.textContent = text;
      bubble.appendChild(content);
      const meta = document.createElement("span");
      meta.className = "meta";
      meta.textContent = formatTime(new Date());
      bubble.appendChild(meta);
      messagesEl.appendChild(bubble);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      return bubble;
    }

    // Prepends "via <provider> · <latency>ms" to a bot bubble's meta line once the backend's
    // `provider` SSE event names which ChatProvider actually answered (see ChatReplyService's
    // streamReplyForUserMessage javadoc) -- surfaces the multi-provider failover/circuit-breaker
    // system that's otherwise invisible behind the chat box.
    function setProviderMeta(bubble, providerId, latencyMs) {
      const meta = bubble.querySelector(".meta");
      meta.textContent = `via ${providerId} · ${latencyMs}ms · ${formatTime(new Date())}`;
    }

    function appendToBubble(bubble, textChunk) {
      bubble.querySelector(".content").textContent += textChunk;
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function addTypingIndicator() {
      const el = document.createElement("div");
      el.className = "typing";
      el.textContent = "Bot is typing…";
      messagesEl.appendChild(el);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      return el;
    }

    // Parses one "event:name\ndata:line1\ndata:line2" SSE frame (already split on the blank
    // line that terminates it) into { event, data }. `event` defaults to "message" per the SSE
    // spec when no `event:` line is present, matching how a native EventSource would report it.
    // Data lines are NOT trimmed: this backend's SseEmitter writes "data:" with no delimiter
    // space (confirmed against the actual Spring bytecode, not assumed), so every character
    // after the colon -- including a token's own leading/trailing space -- is real reply text;
    // trimming it here previously ran streamed words together with no space between them.
    function parseSseFrame(raw) {
      let eventName = "message";
      const dataLines = [];
      for (const line of raw.split("\n")) {
        if (line.startsWith("event:")) {
          eventName = line.slice(6).trim();
        } else if (line.startsWith("data:")) {
          dataLines.push(line.slice(5));
        }
      }
      return { event: eventName, data: dataLines.length ? dataLines.join("\n") : undefined };
    }

    formEl.addEventListener("submit", async (event) => {
      event.preventDefault();
      const text = inputEl.value.trim();
      if (!text) return;

      addBubble(text, "user");
      inputEl.value = "";
      inputEl.disabled = true;
      sendButton.disabled = true;

      const typingEl = addTypingIndicator();
      let botBubble = null;
      let pendingProvider = null;

      try {
        const headers = { "Content-Type": "application/json" };
        if (API_KEY) headers["X-API-Key"] = API_KEY;

        const response = await fetch(API_BASE_URL + "/chat/reply/stream", {
          method: "POST",
          headers,
          body: JSON.stringify({ botId: BOT_ID, userId: USER_ID, message: text, conversationId })
        });

        if (!response.ok || !response.body) {
          typingEl.remove();
          addBubble("Something went wrong. Please try again.", "error");
          return;
        }

        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let buffer = "";

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });

          let boundary;
          while ((boundary = buffer.indexOf("\n\n")) !== -1) {
            const frame = parseSseFrame(buffer.slice(0, boundary));
            buffer = buffer.slice(boundary + 2);
            if (frame.data === undefined) continue;

            if (frame.event === "conversation") {
              conversationId = frame.data;
              localStorage.setItem("chatbot_conversation_id", conversationId);
            } else if (frame.event === "provider") {
              // Arrives before the first text delta (see ChatReplyService), so the bubble may not
              // exist yet -- stash it and apply once addBubble("bot") creates one below.
              const [providerId, latencyMs] = frame.data.split("|");
              if (botBubble) {
                setProviderMeta(botBubble, providerId, latencyMs);
              } else {
                pendingProvider = { providerId, latencyMs };
              }
            } else if (frame.event === "error") {
              if (typingEl.isConnected) typingEl.remove();
              addBubble(frame.data, "error");
            } else {
              if (!botBubble) {
                typingEl.remove();
                botBubble = addBubble("", "bot");
                if (pendingProvider) {
                  setProviderMeta(botBubble, pendingProvider.providerId, pendingProvider.latencyMs);
                  pendingProvider = null;
                }
              }
              appendToBubble(botBubble, frame.data);
            }
          }
        }

        if (!botBubble && typingEl.isConnected) {
          typingEl.remove();
        }
      } catch (err) {
        if (typingEl.isConnected) typingEl.remove();
        addBubble("Could not reach the chat bot service.", "error");
      } finally {
        inputEl.disabled = false;
        sendButton.disabled = false;
        inputEl.focus();
      }
    });

    addBubble("Hi! Ask me anything.", "bot");
  </script>
</body>
</html>

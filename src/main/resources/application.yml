server:
  # PORT (Phase 6, docs/PLAN.md) -- Render, like most PaaS hosts, injects its own PORT env var and
  # requires the app to listen on it; unset (local/docker-compose) falls back to the existing 8080.
  port: ${PORT:8080}
  servlet:
    context-path: /bot

spring:
  application:
    name: chat-bot-service
  main:
    allow-bean-definition-overriding: true
  # The OpenAI starter (added in Phase 0 for Phase 1's OpenAI-compatible providers) bundles
  # autoconfiguration for chat, embedding, image, moderation, and audio models. All of them build
  # an OpenAI client eagerly at bean-creation time, which throws without an OPENAI_API_KEY. None of
  # them fit the multi-provider list shape in chatbot.providers anyway; ProviderRouter builds
  # OpenAiChatModel instances programmatically per provider entry (com.mel.cb.provider) instead of
  # relying on the starter's autoconfiguration.
  autoconfigure:
    exclude:
      - org.springframework.ai.model.openai.autoconfigure.OpenAiChatAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiEmbeddingAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiImageAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiModerationAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioSpeechAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioTranscriptionAutoConfiguration
  datasource:
    # sslmode (Phase 6, docs/PLAN.md) -- "prefer" (pgjdbc's own default is unset/plain, confirmed by
    # decompiling PGProperty rather than assumed) negotiates SSL when the server offers it and falls
    # back to plaintext when it doesn't, so this is a no-op against the local/docker-compose
    # Postgres (no SSL configured there) and works unchanged against a host that requires it (e.g.
    # Neon) -- though Neon's own docs recommend DB_SSLMODE=require explicitly, see
    # docs/DEPLOY_BACKEND.md.
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:chatbot}?sslmode=${DB_SSLMODE:prefer}
    username: ${DB_USER:chatbot}
    password: ${DB_PASSWORD:chatbot}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # Both optional, blank/false by default (Phase 6, docs/PLAN.md) -- local/docker-compose Redis
      # needs neither. A hosted Redis (e.g. Upstash) typically requires both: REDIS_PASSWORD is the
      # token/password Redis sends via AUTH (a blank value here resolves to RedisPassword.none(),
      # confirmed by decompiling spring-data-redis rather than assumed -- no AUTH command is sent,
      # so this is a no-op against a password-less local Redis), and REDIS_SSL_ENABLED=true switches
      # the Lettuce client to TLS. See docs/DEPLOY_BACKEND.md.
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL_ENABLED:false}

management:
  metrics:
    web:
      server:
        auto-time-requests: false
  # Pinned explicitly (Phase 5, docs/PLAN.md) rather than relying on Spring Boot's own default
  # (which already happens to be health-only) -- a future dependency or config change silently
  # widening this shouldn't be able to leak internals to the public internet unnoticed.
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: INFO

resilience4j:
  timelimiter:
    instances:
      chatReply:
        timeout-duration: 20s
  circuitbreaker:
    instances:
      chatReply:
        sliding-window-size: 10
        failure-rate-threshold: 50

chatbot:
  system-prompt: You are a helpful, friendly customer support chat bot. Keep replies concise.

  # Origins allowed to call /chat/** cross-origin (Phase 4, docs/PLAN.md) -- needed once the widget
  # is hosted separately (Vercel) rather than served same-origin by this app. Defaults cover common
  # local static-file dev servers; set CHATBOT_CORS_ALLOWED_ORIGINS to the real deployed widget
  # origin(s), comma-separated. Broader public-facing hardening is Phase 5's job, not this one's.
  cors:
    allowed-origins: ${CHATBOT_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5500,http://127.0.0.1:5500}

  # Public-facing hardening (Phase 5, docs/PLAN.md), all applied to /chat/** via
  # com.mel.cb.security.SecurityFilterConfig. api-key is unset by default -- a from-scratch
  # self-host boots without any secrets configured, same convention as every provider/tool key in
  # this project, but /chat/** stays reachable without authentication until it's set (a warning is
  # logged at startup either way). max-request-bytes is a coarse pre-parse guard, ahead of
  # ChatMessage's own 4000-char @Size validation on the parsed message. rate-limit is per client IP,
  # independent of ProviderRouter's own per-provider rate limiters (which protect the free-tier
  # providers' quotas, not this service's own front door).
  security:
    api-key: ${CHATBOT_API_KEY:}
    max-request-bytes: 8192
    rate-limit:
      enabled: true
      requests-per-minute: 20

  # Conversation memory (Phase 2, docs/PLAN.md): per-conversation history/summary live in Redis
  # with a sliding TTL (refreshed on every turn) approximating a single chat session; user-facts
  # extracted from evicted turns are persisted to Postgres and outlive the session. session-ttl
  # takes Spring's simple duration shorthand (e.g. 6h, 8h, 10h) -- 8h is the midpoint of the 6-10h
  # session window this was scoped to. user-token-budget is a per-user total, split evenly across
  # however many of that user's conversations are currently active (see ConversationMemoryService);
  # eviction-threshold mirrors QuotaTracker's 90%-of-cap convention. Token counts here are a cheap
  # char-based estimate for budgeting, not a real tokenizer -- see RedisConversationMemoryStore.
  memory:
    session-ttl: 8h
    user-token-budget: 10000
    eviction-threshold: 0.9
    min-raw-turns-kept: 4

  # Tools (Phase 3, docs/PLAN.md): exposed to the model via Spring AI function-calling
  # (com.mel.cb.tools.ChatToolsRegistry), so the model decides when to call one mid-conversation.
  # weather/time need no key at all (Open-Meteo is free and keyless, used for geocoding too);
  # transit/web-search do, and follow the same optional/off-by-default-until-keyed convention as
  # OpenAiCompatibleProvider below -- ToolsConfig resolves each api-key-env and the tool disables
  # itself (left out of the model's tool list entirely) if it's not set, rather than being offered
  # and failing when called.
  tools:
    geocoding-base-url: https://geocoding-api.open-meteo.com
    weather:
      base-url: https://api.open-meteo.com
    # "transit" is deliberately scoped to driving/cycling/walking directions, not real public-transit
    # schedules -- OpenRouteService's free tier (2,000 requests/day) doesn't offer transit routing,
    # and no free, global, keyless alternative for that exists. See TransitTools.
    transit:
      base-url: https://api.openrouteservice.org
      api-key-env: OPENROUTESERVICE_API_KEY
    # Tavily (free tier: 1,000 requests/month), chosen over zero-key "instant answer" APIs since
    # those only cover direct-answer lookups, not general web results. See WebSearchTools.
    web-search:
      base-url: https://api.tavily.com
      api-key-env: TAVILY_API_KEY

  # Free-tier OpenAI-compatible providers, tried in priority order by ProviderRouter. Each
  # `limits` block is what QuotaTracker checks against (90% of either cap skips the provider for
  # the rest of the UTC day); the verified-on comment records when these numbers were last
  # checked against the provider's own docs, since free-tier terms change without notice.
  providers:
    - id: gemini
      base-url: https://generativelanguage.googleapis.com/v1beta/openai
      model: gemini-2.5-flash
      api-key-env: GEMINI_API_KEY
      priority: 1
      limits:
        requests-per-day: 250
        tokens-per-day: 50000000
        # verified-on: 2026-08-28 -- Google AI Studio free tier, gemini-2.5-flash: 10 RPM / 250
        # RPD / 250K TPM per official docs. No published per-day token cap; tokens-per-day here
        # is a generous non-binding safety ceiling -- requests-per-day is the real constraint.
    - id: groq
      base-url: https://api.groq.com/openai/v1
      model: llama-3.3-70b-versatile
      api-key-env: GROQ_API_KEY
      priority: 2
      limits:
        requests-per-day: 14400
        tokens-per-day: 100000
        # verified-on: 2026-08-28 -- Groq free tier, llama-3.3-70b-versatile: 30 RPM / 14,400 RPD.
        # Per-model TPM is reported as 6K-20K depending on model; ~100K tokens/day is the commonly
        # cited practical ceiling for steady use of this model -- treat as approximate.
    - id: cerebras
      base-url: https://api.cerebras.ai/v1
      model: llama-3.3-70b
      api-key-env: CEREBRAS_API_KEY
      priority: 3
      limits:
        requests-per-day: 7200
        tokens-per-day: 1000000
        # verified-on: 2026-08-28 -- Cerebras free tier: 1M tokens/day is consistently documented
        # across official and third-party sources. RPM is reported inconsistently (5-30 RPM
        # depending on source/model), so requests-per-day is a conservative derived estimate
        # (5 RPM x 1440 min), not an official daily figure.
    - id: mistral
      base-url: https://api.mistral.ai/v1
      model: mistral-small-latest
      api-key-env: MISTRAL_API_KEY
      priority: 4
      limits:
        requests-per-day: 500
        tokens-per-day: 33000000
        # verified-on: 2026-08-28 -- Mistral no longer publishes exact free-tier ("Experiment"
        # plan) rate limits; ~1B tokens/month is commonly cited (~33M/day here). requests-per-day
        # is a conservative placeholder -- check https://admin.mistral.ai/plateforme/limits and
        # adjust before relying on this in production.
    - id: openrouter
      base-url: https://openrouter.ai/api/v1
      model: "deepseek/deepseek-chat-v3.1:free"
      api-key-env: OPENROUTER_API_KEY
      priority: 5
      limits:
        requests-per-day: 50
        tokens-per-day: 100000000
        # verified-on: 2026-08-28 -- OpenRouter free-model daily cap: 50 requests/day with no
        # purchased credit balance (rises to 1000/day after any $10+ lifetime purchase), 20 RPM.
        # OpenRouter meters free models by request count, not tokens, so tokens-per-day here is a
        # generous non-binding safety ceiling.

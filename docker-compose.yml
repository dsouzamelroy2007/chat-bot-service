services:
  web:
    build: .
    image: chat-bot-service
    container_name: chatbotservice
    ports:
      - 8080:8080
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - MISTRAL_API_KEY=${MISTRAL_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENROUTESERVICE_API_KEY=${OPENROUTESERVICE_API_KEY:-}
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
      # Unlike the keys above, an empty value here isn't harmless (it'd mean "no origins allowed"
      # rather than "feature disabled"), so this uses compose's own :- default -- kept in sync with
      # application.yml's chatbot.cors.allowed-origins default -- rather than passing through blank.
      - CHATBOT_CORS_ALLOWED_ORIGINS=${CHATBOT_CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5500,http://127.0.0.1:5500}
      - CHATBOT_API_KEY=${CHATBOT_API_KEY:-}
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-chatbot}
      - DB_USER=${DB_USER:-chatbot}
      - DB_PASSWORD=${DB_PASSWORD:-chatbot}
      - REDIS_HOST=redis
      - REDIS_PORT=6379

  postgres:
    # pgvector/pgvector:pg16 (RAG follow-up, docs/PLAN.md) -- same Postgres 16 base as plain
    # postgres:16-alpine, drop-in compatible (same env vars, same volume path), but with the
    # pgvector extension preinstalled -- required by V2__add_embedding_to_user_facts.sql.
    image: pgvector/pgvector:pg16
    container_name: chatbotservice-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${DB_NAME:-chatbot}
      - POSTGRES_USER=${DB_USER:-chatbot}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-chatbot}
    ports:
      - ${DB_HOST_PORT:-5432}:5432
    volumes:
      - chatbot-postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: chatbotservice-redis
    restart: unless-stopped
    ports:
      - ${REDIS_HOST_PORT:-6379}:6379
    volumes:
      - chatbot-redis-data:/data

volumes:
  chatbot-postgres-data:
  chatbot-redis-data:
